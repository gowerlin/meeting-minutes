<head>

<style>
/* meeting-minutes-pro 網頁版樣板（2.1.0 規格 §4、§5.5；版型取自 longform-report 樣板 v1.1.0，已複製成本工具自己的檔案，執行時不依賴它）。
   完全離線：不載入任何字型、圖片或程式庫；字型只用系統已安裝的字型名稱。
   主題：預設深色（bare :root），淺色寫在 :root[data-theme="light"]；元件規則只引用 token。 */
:root {
  --bg: #10151b; --surface: #171e26; --band: #1c242e; --ink: #e5eaf0; --ink-2: #9daaba;
  --line: #2a3542; --line-strong: #4a5869; --accent: #74a6ff; --accent-2: #f0ae47;
  --warn: #f2c066; --warn-bg: #36290f; --ok: #7fd6a6; --ok-bg: #143022;
  --code-bg: #0c1116; --code-ink: #dbe2ea;
  color-scheme: dark;
  --font-display: "Noto Serif TC", "Source Han Serif TC", "Songti TC", "PMingLiU", serif;
  --font-body: "Noto Sans TC", "Source Han Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
  --font-mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, "Noto Sans Mono", monospace;
  --toc-bar-h: 48px;
  --toc-w: clamp(220px, 18vw, 264px);
  --main-wide: 1200px;
  --dock-h: 0px;     /* 正文底部要讓出的高度（播放列＋間距）；有 JS 時依播放列實際高度設定 */
  --dock-bar: 0px;   /* 底部整列播放列的高度（左側目錄要讓出的高度；桌機影片小窗不佔底部整列＝0） */
  --video-max: min(30vh, 240px);   /* 影片畫面的最大高度：播放列（含控制列）一定放得進視窗 */
}
:root[data-theme="light"] {
  --bg: #f4f6f9; --surface: #ffffff; --band: #eaeef3; --ink: #18212c; --ink-2: #4b5868;
  --line: #d6dde6; --line-strong: #a9b5c3; --accent: #2b67c9; --accent-2: #b8720c;
  --warn: #8a5a00; --warn-bg: #fdf1d8; --ok: #23704a; --ok-bg: #e2f3ea;
  --code-bg: #f2f5f8; --code-ink: #1b2430;
  color-scheme: light;
}
:root:has(#dock.dock-audio) { --dock-h: 96px; --dock-bar: 96px; }                       /* 沒有 JS 時的估計值 */
:root:has(#dock.dock-video) { --dock-h: calc(var(--video-max) + 72px); --dock-bar: calc(var(--video-max) + 72px); }
:root:has(#dock[hidden]) { --dock-h: 0px; --dock-bar: 0px; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15.5px; line-height: 1.75; }
.page {
  max-width: 980px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 36px calc(96px + var(--dock-h));
  display: grid; gap: 48px; min-width: 0;
}
.prose { max-width: 46em; }
h1, h2 { font-family: var(--font-display); text-wrap: balance; letter-spacing: 0.01em; }
h1 { font-size: clamp(1.6rem, 1.15rem + 2vw, 2.3rem); line-height: 1.3; margin: 0; }
h2 { font-size: 1.45rem; line-height: 1.35; margin: 0; display: flex; flex-wrap: wrap; gap: 0.2em 0.6em; align-items: baseline; }
h2 .no { font-family: var(--font-mono); font-size: 0.85rem; font-weight: 500; color: var(--ink-2); }
h3 { font-size: 1.05rem; margin: 8px 0 0; line-height: 1.5; text-wrap: balance; }
h4 { font-size: 0.95rem; margin: 4px 0 0; }
p, ul, ol { margin: 0; }
ul, ol { padding-left: 1.3em; display: grid; gap: 0.35em; }
ul ul { margin-top: 0.35em; }
a { color: var(--accent); text-underline-offset: 2px; overflow-wrap: anywhere; }
a:focus-visible, button:focus-visible, summary:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
code, .mono { font-family: var(--font-mono); font-size: 0.88em; }
code { background: var(--band); padding: 0.05em 0.35em; border-radius: 3px; overflow-wrap: anywhere; }
.url { font-family: var(--font-mono); font-size: 0.85em; overflow-wrap: anywhere; color: var(--ink-2); }
.muted { color: var(--ink-2); }
.small { font-size: 0.875rem; }
section { display: grid; gap: 16px; min-width: 0; }
section > header { padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.page [id] { scroll-margin-top: calc(var(--toc-bar-h) + 16px); }

/* 頁首 */
.masthead { display: grid; gap: 14px; min-width: 0; }
.masthead-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.eyebrow { font-family: var(--font-mono); font-size: 0.78rem; letter-spacing: 0.06em; color: var(--ink-2); margin: 0; }
.theme-toggle { font: inherit; font-size: 0.8rem; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 999px; padding: 3px 12px; cursor: pointer; white-space: nowrap; }
.theme-toggle:hover { color: var(--ink); }
.status { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; font-size: 0.85rem; color: var(--ink-2); }
.badge { display: inline-block; font-size: 0.78rem; font-weight: 700; line-height: 1.6; padding: 0 8px; border-radius: 4px; border: 1px dashed var(--warn); color: var(--warn); background: var(--warn-bg); white-space: nowrap; }
.status.ok .badge { border-style: solid; border-color: var(--ok); color: var(--ok); background: var(--ok-bg); }
.status-line { min-width: 0; overflow-wrap: anywhere; }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr)); gap: 8px 24px; margin: 0; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.meta > div { min-width: 0; }
.meta dt { font-size: 0.75rem; color: var(--ink-2); font-weight: 700; }
.meta dd { margin: 0; font-size: 0.9rem; overflow-wrap: anywhere; }
.counts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.count { display: grid; gap: 2px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; text-decoration: none; color: var(--ink); min-width: 0; }
.count:hover { background: var(--band); }
.count-n { font-family: var(--font-mono); font-size: 1.5rem; font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; }
.count-l { font-size: 0.85rem; color: var(--ink-2); }

/* 目錄（longform-report 樣板 § 3：手機頂端列、桌機左側 sticky 欄，共用同一份 <details>） */
.toc-nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.toc-drawer { position: relative; max-width: 948px; margin: 0 auto; }
.toc-drawer > summary { min-height: var(--toc-bar-h); display: flex; align-items: center; gap: 10px; cursor: pointer; list-style: none; font-size: 0.9rem; font-weight: 700; }
.toc-drawer > summary::-webkit-details-marker { display: none; }
.toc-drawer > summary::after { content: ""; flex: none; margin-left: auto; margin-right: 4px; width: 7px; height: 7px; border-right: 2px solid var(--ink-2); border-bottom: 2px solid var(--ink-2); transform: translateY(-2px) rotate(45deg); }
.toc-drawer[open] > summary::after { transform: translateY(2px) rotate(-135deg); }
.toc-now { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); font-weight: 500; }
.toc-panel { position: absolute; top: 100%; left: 0; right: 0; max-height: min(70vh, 560px); overflow-y: auto; overscroll-behavior: contain;
  background: var(--surface); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 10px 10px;
  box-shadow: 0 10px 24px color-mix(in srgb, var(--ink) 16%, transparent); padding: 8px 8px 12px; }
.toc-title { display: none; }
.toc-list, .toc-sub { list-style: none; padding: 0; margin: 0; display: grid; gap: 1px; }
.toc-sub { margin-top: 1px; }
.toc-list a { display: flex; gap: 8px; align-items: baseline; padding: 5px 10px; border-left: 3px solid var(--line); border-radius: 0 4px 4px 0; color: var(--ink-2); text-decoration: none; font-size: 0.875rem; line-height: 1.5; overflow-wrap: anywhere; }
.toc-list .no { flex: none; min-width: 1.1em; font-family: var(--font-mono); font-size: 0.75rem; color: var(--ink-2); }
.toc-sub a { padding-left: 32px; font-size: 0.8125rem; }
.toc-list a:hover { color: var(--ink); background: var(--band); }
.toc-list a:focus-visible { outline-offset: -2px; }
.toc-list > li.has-current > a { color: var(--ink); font-weight: 700; border-left-color: var(--line-strong); }
.toc-list a[aria-current] { color: var(--ink); font-weight: 700; background: var(--band); border-left-color: var(--accent); }
.toc-js .toc-sub { height: 0; margin-top: 0; overflow: clip; }
.toc-js .toc-list > li.is-open > .toc-sub, .toc-js .toc-nav:has(a:focus-visible) .toc-sub { height: auto; margin-top: 1px; }
@media (min-width: 1024px) {
  .shell { display: grid; grid-template-columns: var(--toc-w) minmax(0, var(--main-wide)); justify-content: center; column-gap: 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .shell > .page { margin: 0; max-width: none; padding-left: 0; padding-right: 0; }
  .page [id] { scroll-margin-top: 24px; }
  .toc-nav { align-self: start; max-height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - var(--dock-bar));
    overflow-y: auto; overscroll-behavior: contain; background: none; border-bottom: 0; padding: 36px 4px 24px 0; z-index: auto; }
  .toc-drawer { max-width: none; margin: 0; }
  .toc-panel { position: static; max-height: none; overflow: visible; background: none; border: 0; box-shadow: none; padding: 0; }
  .toc-title { display: block; margin: 0 0 10px 13px; }
  .toc-js .toc-drawer > summary { display: none; }
  @supports selector(::details-content) {
    .toc-drawer > summary { display: none; }
    .toc-drawer::details-content { content-visibility: visible; display: block; }
  }
}

/* 表格：容器內水平捲動，頁面本身不捲 */
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 0.875rem; line-height: 1.6; }
.tbl.wide table { min-width: 720px; }
th, td { text-align: left; vertical-align: top; padding: 9px 12px; border-bottom: 1px solid var(--line); }
tbody tr:last-child > * { border-bottom: 0; }
thead th { font-size: 0.8rem; color: var(--ink-2); font-weight: 700; background: var(--band); white-space: nowrap; }
tbody th { font-weight: 700; white-space: nowrap; }
td.num, th.num { font-variant-numeric: tabular-nums; white-space: nowrap; }

.callout { border-left: 3px solid var(--warn); background: var(--warn-bg); padding: 10px 14px; border-radius: 0 6px 6px 0; font-size: 0.925rem; display: grid; gap: 6px; margin: 0; }
.note { border-left: 3px solid var(--line-strong); padding: 2px 0 2px 14px; color: var(--ink-2); font-size: 0.9rem; margin: 0; }
pre.code { margin: 0; overflow-x: auto; background: var(--code-bg); color: var(--code-ink); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; font-size: 0.8125rem; line-height: 1.6; }
pre.code code { background: none; padding: 0; overflow-wrap: normal; }

/* 轉寫品質備註 */
details.quality { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
details.quality > summary { cursor: pointer; padding: 10px 14px; font-weight: 700; }
.quality-body { padding: 0 16px 14px; display: grid; gap: 12px; font-size: 0.9rem; }

/* 時間碼：有播放器時是按鈕，沒有時是純文字（<time>） */
.tc { font: inherit; font-family: var(--font-mono); font-size: 0.86em; font-variant-numeric: tabular-nums; line-height: 1.4; color: var(--accent);
  background: color-mix(in srgb, var(--accent) 10%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
  border-radius: 4px; padding: 0 5px; cursor: pointer; white-space: nowrap; }
.tc::before { content: "▶"; font-size: 0.7em; margin-right: 4px; vertical-align: 0.1em; }
.tc:hover { background: color-mix(in srgb, var(--accent) 20%, transparent); }
.tc.is-last { border-style: solid; border-color: var(--accent); }
.tc-text { font-family: var(--font-mono); font-size: 0.86em; font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap; }

/* 播放列（規格 §5.5）：錄音＝底部整列；影片＝桌機右下小窗、手機底部整列。
   播放列（含原生控制列）的高度一律放得進視窗：影片畫面最高 --video-max；收合只藏影片畫面（聲音照常），控制改用「播放／全螢幕」鈕。
   播放列不是捲動容器，不攔截頁面捲動；正文底部依播放列實際高度讓出空間（JS 量測後設定 --dock-h）。 */
.dock { position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line-strong);
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; max-height: 100vh;
  box-shadow: 0 -6px 18px color-mix(in srgb, #000 22%, transparent); }
.dock[hidden] { display: none; }
.dock-head { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: 0.78rem; color: var(--ink-2); min-width: 0; }
.dock-title { flex: 1 1 10em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dock-status { color: var(--accent); white-space: nowrap; }
.dock-status:empty { display: none; }
.dock-btns { display: flex; gap: 6px; margin-left: auto; }
.dock-btn { font: inherit; font-size: 0.75rem; line-height: 1.6; color: var(--ink-2); background: none; border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 8px; cursor: pointer; white-space: nowrap; }
.dock-btn:hover { color: var(--ink); }
.dock-btn[hidden] { display: none; }
.dock-media { min-width: 0; }
.dock audio { width: 100%; height: 40px; display: block; }
.dock video { width: 100%; height: auto; max-height: var(--video-max); display: block; background: #000; border-radius: 4px; }
.dock video:fullscreen { max-height: none; border-radius: 0; }
.dock.folded .dock-media { display: none; }
@media (min-width: 1024px) {
  :root { --video-max: min(225px, calc(100vh - 150px)); }
  .dock-audio { left: calc(50% - min(50%, 640px)); right: calc(50% - min(50%, 640px)); border: 1px solid var(--line-strong); border-bottom: 0; border-radius: 10px 10px 0 0; }
  .dock-video { left: auto; right: 16px; bottom: 16px; width: min(400px, calc(100vw - 32px)); max-height: calc(100vh - 32px);
    border: 1px solid var(--line-strong); border-radius: 10px; padding: 8px 10px; }
}

footer.colophon { border-top: 1px solid var(--line); padding-top: 16px; font-size: 0.8rem; color: var(--ink-2); }

@media (max-width: 560px) {
  body { font-size: 15px; }
  .page { gap: 40px; padding-block: 24px calc(72px + var(--dock-h)); }
  .counts { gap: 8px; }
  .count { padding: 10px 10px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
@media print {
  .toc-nav, .dock, .theme-toggle { display: none !important; }
  .shell { display: block; padding: 0; }
  .page, .shell > .page { max-width: none; padding: 0; }
  .tc { border: 0; background: none; color: inherit; padding: 0; }
  .tc::before { content: none; }
  .tbl { overflow: visible; }
  .tbl.wide table { min-width: 0; }
  thead th, tbody th { white-space: normal; }
}
</style>

<script>
/* 1 主題：預設依頁面產生時的設定；使用者切換後記在這個瀏覽器（讀寫失敗就只在這次有效）。
   2 目錄：桌機展開成側欄、手機點選後收合；IntersectionObserver 標示目前章節（判定線在視窗高度 25%）。
   3 時間碼：點了跳到原始媒體的該秒播放；媒體載入失敗就收起播放列、時間碼改回純文字。
   4 播放列：依實際高度讓出正文底部；影片可收合、全螢幕（退出後回到原位置）。
   不發出任何網路請求。 */
(function () {
  var root = document.documentElement;
  var KEY = 'mmp-theme';
  try { var saved = localStorage.getItem(KEY); if (saved === 'light' || saved === 'dark') root.setAttribute('data-theme', saved); } catch (e) {}
  var top = document.querySelector('.masthead');
  if (top) {
    var eb = top.querySelector('.eyebrow');
    var row = document.createElement('div');
    row.className = 'masthead-top';
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'theme-toggle';
    function label() {
      var light = root.getAttribute('data-theme') === 'light';
      btn.textContent = light ? '改成深色' : '改成淺色';
      btn.setAttribute('aria-label', light ? '目前是淺色主題，改成深色' : '目前是深色主題，改成淺色');
    }
    btn.addEventListener('click', function () {
      var next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem(KEY, next); } catch (e) {}
      label();
    });
    label();
    if (eb) { top.insertBefore(row, eb); row.appendChild(eb); } else { top.insertBefore(row, top.firstChild); }
    row.appendChild(btn);
  }

  /* 目錄指到〈轉寫品質備註〉時把它展開 */
  function openTarget(id) {
    var el = id && document.getElementById(id);
    if (el && el.tagName === 'DETAILS') el.open = true;
  }
  openTarget(location.hash.slice(1));
  window.addEventListener('hashchange', function () { openTarget(location.hash.slice(1)); });
  window.addEventListener('beforeprint', function () { document.querySelectorAll('details.quality').forEach(function (d) { d.open = true; }); });

  var nav = document.querySelector('.toc-nav');
  var drawer = document.getElementById('toc-drawer');
  if (nav && drawer) {
    root.classList.add('toc-js');
    var wide = window.matchMedia('(min-width: 1024px)');
    var syncDrawer = function () { drawer.open = wide.matches; };
    syncDrawer();
    if (wide.addEventListener) wide.addEventListener('change', syncDrawer); else if (wide.addListener) wide.addListener(syncDrawer);
    drawer.addEventListener('click', function (e) {
      var a = e.target.closest('a');
      if (a) openTarget(a.getAttribute('href').slice(1));
      if (!wide.matches && a) drawer.open = false;
    });
    drawer.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !wide.matches && drawer.open) { drawer.open = false; drawer.querySelector('summary').focus(); }
    });
    if ('IntersectionObserver' in window) {
      var now = nav.querySelector('.toc-now');
      var items = [];
      nav.querySelectorAll('.toc-list a[href^="#"]').forEach(function (a) {
        var el = document.getElementById(a.getAttribute('href').slice(1));
        if (el) items.push({ a: a, el: el, top: a.closest('.toc-list > li') });
      });
      var current = null;
      var keepVisible = function (a) {
        if (!wide.matches || nav.scrollHeight <= nav.clientHeight) return;
        var r = a.getBoundingClientRect(), b = nav.getBoundingClientRect();
        if (r.top < b.top + 12) nav.scrollTop -= b.top + 12 - r.top;
        else if (r.bottom > b.bottom - 12) nav.scrollTop += r.bottom - b.bottom + 12;
      };
      var atBottom = function () { return window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2; };
      var update = function () {
        var line = window.innerHeight * 0.25, next = null;
        if (atBottom()) next = items[items.length - 1] || null;
        else for (var i = 0; i < items.length; i++) { if (items[i].el.getBoundingClientRect().top <= line) next = items[i]; }
        if (next === current) return;
        if (current) { current.a.removeAttribute('aria-current'); current.top.classList.remove('is-open', 'has-current'); }
        current = next;
        if (!next) { now.textContent = ''; return; }
        next.a.setAttribute('aria-current', 'location');
        next.top.classList.add('is-open');
        if (next.a.parentElement !== next.top) next.top.classList.add('has-current');
        now.textContent = '· ' + next.top.querySelector('.toc-label').textContent;
        keepVisible(next.a);
      };
      var io = new IntersectionObserver(update, { rootMargin: '0px 0px -75% 0px' });
      items.forEach(function (it) { io.observe(it.el); });
      var bottom = atBottom();
      window.addEventListener('scroll', function () { if (atBottom() !== bottom) { bottom = !bottom; update(); } }, { passive: true });
      window.addEventListener('resize', update);
      update();
    }
  }

  /* 時間碼與播放列（規格 §5.4～§5.6） */
  var media = document.getElementById('media');
  var dock = document.getElementById('dock');
  if (!media || !dock) return;
  var isVideo = media.tagName === 'VIDEO';
  var status = dock.querySelector('.dock-status');
  var wideDock = window.matchMedia('(min-width: 1024px)');
  var last = null;
  var fsY = null;
  function fsEl() { return document.fullscreenElement || document.webkitFullscreenElement || null; }
  /* 正文底部讓出播放列的實際高度：捲到底時最後一段在播放列上方（不量到全螢幕時的高度） */
  function measure() {
    if (fsEl()) return;
    if (dock.hidden) { root.style.setProperty('--dock-h', '0px'); root.style.setProperty('--dock-bar', '0px'); return; }
    var r = dock.getBoundingClientRect();
    var gap = Math.max(0, window.innerHeight - r.bottom);
    var need = Math.ceil(r.height + gap + 16);
    root.style.setProperty('--dock-h', need + 'px');
    root.style.setProperty('--dock-bar', (isVideo && wideDock.matches ? 0 : need) + 'px');
  }
  if ('ResizeObserver' in window) new ResizeObserver(measure).observe(dock);
  window.addEventListener('resize', measure);
  media.addEventListener('loadedmetadata', measure);
  measure();
  function toText() {
    dock.hidden = true;
    measure();
    document.querySelectorAll('button.tc').forEach(function (b) {
      var t = b.querySelector('time');
      if (t) { t.className = 'tc-text'; b.replaceWith(t); }
    });
  }
  media.addEventListener('error', toText);
  if (media.error) toText();
  function seek(t) {
    var go = function () {
      if (isFinite(media.duration) && t > media.duration) t = Math.max(0, media.duration - 1);
      media.currentTime = t;
      var p = media.play();
      if (p && p.catch) p.catch(function () {});
    };
    if (media.readyState >= 1) go(); else media.addEventListener('loadedmetadata', go, { once: true });
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('button.tc');
    if (!b) return;
    var t = +b.getAttribute('data-t');
    if (!isFinite(t)) return;
    if (last) last.classList.remove('is-last');
    last = b; b.classList.add('is-last');
    seek(t);
    if (status) status.textContent = '從 ' + b.textContent + ' 播放';
  });
  if (!isVideo) return;
  /* 影片：收合（只藏畫面，聲音照常；收合時用「播放／暫停」鈕）、全螢幕（退出後回到原本的捲動位置） */
  var fold = dock.querySelector('.dock-fold');
  var play = dock.querySelector('.dock-play');
  var full = dock.querySelector('.dock-full');
  function setFold(f) {
    dock.classList.toggle('folded', f);
    if (fold) { fold.setAttribute('aria-expanded', f ? 'false' : 'true'); fold.textContent = f ? '展開影片' : '收合影片'; }
    if (play) play.hidden = !f;
    measure();
  }
  function syncPlay() { if (play) play.textContent = media.paused ? '播放' : '暫停'; }
  if (fold) { fold.hidden = false; fold.addEventListener('click', function () { setFold(!dock.classList.contains('folded')); }); }
  if (play) {
    play.addEventListener('click', function () {
      if (media.paused) { var p = media.play(); if (p && p.catch) p.catch(function () {}); } else media.pause();
    });
    media.addEventListener('play', syncPlay);
    media.addEventListener('pause', syncPlay);
    syncPlay();
  }
  var canFull = !!(media.requestFullscreen || media.webkitRequestFullscreen || media.webkitEnterFullscreen);
  if (full && canFull) {
    full.hidden = false;
    full.addEventListener('click', function () {
      if (dock.classList.contains('folded')) setFold(false);
      fsY = window.scrollY;
      var p = null;
      if (media.requestFullscreen) p = media.requestFullscreen();
      else if (media.webkitRequestFullscreen) media.webkitRequestFullscreen();
      else media.webkitEnterFullscreen();
      if (p && p.catch) p.catch(function () { fsY = null; });
    });
  }
  function onFs() {
    if (fsEl()) { if (fsY === null) fsY = window.scrollY; return; }
    var y = fsY;
    fsY = null;
    measure();
    if (y !== null) window.scrollTo({ top: y, behavior: 'instant' });
  }
  document.addEventListener('fullscreenchange', onFs);
  document.addEventListener('webkitfullscreenchange', onFs);
  media.addEventListener('webkitendfullscreen', onFs);
})();
</script>
</body>
</html>
